# Publishes a GitHub release containing the plugin zip when a version tag is pushed.
#
#   1. Bump "version" in package.json (and package-lock.json) and merge to main.
#   2. git tag v<version> && git push origin v<version>
#
# The tag must match package.json, otherwise the release is refused.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: npm ci
      - name: Build and package the plugin zip
        run: npm run release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "liveupdate_tester_v${VERSION}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
